  function paint(p){
    const d=Math.max(.001,p*100)+' 100';pr.setAttribute('stroke-dasharray',d);gl.setAttribute('stroke-dasharray',d);
    const pt=tr.getPointAtLength(len*p);hd.setAttribute('cx',pt.x);hd.setAttribute('cy',pt.y);hd2.setAttribute('cx',pt.x);hd2.setAttribute('cy',pt.y);
    hd.style.opacity=hd2.style.opacity=p>0&&p<1?1:0;
  }
  function loop(now){
    if(gone)return;
    const dt=Math.min(.1,(now-last)/1000);last=now;
    // tiến mượt về mục tiêu; khi đã tải xong thì chạy nốt vòng với tốc độ cố định (~0.6s)
    if(fin)shown=Math.min(1,shown+dt*1.7);else shown+=(Math.min(target,.98)-shown)*Math.min(1,dt*5);
    paint(shown);
    if(fin&&shown>=1){gone=true;paint(1);setTimeout(()=>{root.classList.add('out');setTimeout(()=>{root.remove();if(cb)cb()},520)},350);return}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  return {set:p=>{if(p>target)target=p},done:f=>{cb=f;fin=true}};
})();
</script>
